name: Build Maddookie Android & TV APKs

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Maddookie Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Maddookie Mobile & TV Debug APKs
        run: ./gradlew assembleMobileDebug assembleTvDebug

      - name: Upload Maddookie APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maddookie-apks
          path: |
            app/build/outputs/apk/**/*.apk
